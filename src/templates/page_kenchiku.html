  <div class="hero"><div class="hero-wrap">{{HERO_IMG}}</div></div>

  <div class="wrap">
    <section>
      <div class="service-tag eyebrow"><span class="dot"></span>{{EYEBROW}}</div>

      <h1>{{HEADING}}</h1>

      <div class="lede">
        <p>{{BODY}}</p>
        <p class="career">{{CAREER}}</p>
      </div>
    </section>

    <section class="feature">
      <div class="feature-head">
        <h2>{{FEATURE_TITLE}}</h2>
{{FEATURE_NOTE}}
      </div>
      <figure>
        {{FEATURE_IMG}}
{{FEATURE_CAPTION}}
      </figure>
    </section>

    <section class="gallery-section">
      <div class="gallery-head">
        <h2>{{GALLERY_TITLE}}</h2>
        <span class="note mono">{{GALLERY_NOTE}}</span>
      </div>
      <div class="gallery-grid">
{{GALLERY_ITEMS}}
      </div>
    </section>

    <section class="cta-band" id="contact">
      <div class="cta-copy">
{{CTA_LINES}}
        <p class="cta-address"><a href="{{CTA_HREF}}">{{CTA_EMAIL}}</a></p>
{{CTA_NOTE}}
      </div>
      <a class="btn" href="{{CTA_HREF}}">
        {{CTA_LABEL}}
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </section>
  </div>
